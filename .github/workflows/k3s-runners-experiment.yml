name: k3s multi-runner experiment

# Experiment: one k3s cluster spanning several GitHub-hosted runners, joined over
# Tailscale. Measures join time, Tailscale paths, pod RTT and throughput across runners,
# then runs a public StacksNetwork example (minimal by default) across them.
# Requires repository variables TS_OAUTH_CLIENT_ID and TS_AUDIENCE from a Tailscale
# OpenID Connect trust credential (auth_keys write on tag:ci), and a random
# K3S_TOKEN_SALT secret. The tailnet policy should let tag:ci reach only tag:ci.
# Live access (dashboard on port 8080, Tailscale SSH as runner) additionally needs a
# policy grant and SSH rule from your members to tag:ci; the job summary has the links.
on:
  push:
    branches:
      - feat/k3d-gh-runner
    paths:
      - .github/workflows/k3s-runners-experiment.yml
      - .github/k3s-runners/**
      - .github/runner-lib/**
  workflow_dispatch:
    inputs:
      example:
        description: Public StacksNetwork example under docs/design/public-api/examples
        type: choice
        options: [minimal, 30-actors]
        default: minimal
      hold:
        description: Minutes to keep the network up for inspection before teardown
        type: choice
        options: ['0', '30', '60', '90']
        default: '0'
      operator_node:
        description: >-
          Where the network operator runs in network mode: server (next to the API server, routine)
          or agent (remote from it, a latency regression scenario)
        type: choice
        options: [server, agent]
        default: server
      mode:
        description: >-
          network runs the example; placement resolves it with the operator on agent-1, server, agent-1;
          images resolves it on agent-1 with the base image, then HEAD, then base
        type: choice
        options: [network, placement, images]
        default: network
      base_revert:
        description: images mode only; commit whose revert from HEAD builds the base image
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # Tailscale workload identity federation

concurrency:
  group: k3s-runners-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENTS: 4
  NODE_PREFIX: k3s-${{ github.run_id }}-${{ github.run_attempt }}
  SERVER_HOST: k3s-${{ github.run_id }}-${{ github.run_attempt }}-server
  TOKEN_SEED: ${{ github.run_id }}-${{ github.run_attempt }}-${{ secrets.K3S_TOKEN_SALT }}
  EXAMPLE: ${{ inputs.example || 'minimal' }}
  HOLD_MINUTES: ${{ inputs.hold || '0' }}
  HOLD_RELEASE: /tmp/stacks-k8s-release
  BASE_REVERT: ${{ inputs.mode == 'images' && inputs.base_revert || '' }}

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    # Expressions have no arithmetic: 85 minutes (setup, up to 20 minutes of
    # resolution and 40 of initialization, teardown) plus the selected hold.
    timeout-minutes: ${{ inputs.hold == '90' && 175 || inputs.hold == '60' && 145 || inputs.hold == '30' && 115 || 85 }}
    env:
      KCFG: /etc/rancher/k3s/k3s.yaml
      CTX: default
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # BASE_REVERT builds need the reverted commit
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          hostname: ${{ env.SERVER_HOST }}
          args: --ssh
      - run: .github/k3s-runners/install-k3s.sh
      - name: Build operator images
        run: |
          set -o pipefail
          mkdir -p out
          .github/k3s-runners/load-operator-image.sh | tee out/images.txt
      - run: .github/k3s-runners/k3s-node.sh server
      - name: Measure
        run: |
          set -o pipefail
          mkdir -p out
          .github/k3s-runners/measure.sh "$AGENTS" | tee out/measurements.md
          cat out/measurements.md >> "$GITHUB_STEP_SUMMARY"
      - name: Install network operator
        run: |
          helm --kubeconfig "$KCFG" --kube-context "$CTX" upgrade --install network charts/stacks-network-operator \
            --namespace stacks-network-system --create-namespace --wait --timeout 5m \
            --set image.tag=ci --set bitcoinObserverImage=stacks-network-operator:ci
          # Experiment-only direct-read accounting (operators/network/internal/apiaccounting).
          kubectl --kubeconfig "$KCFG" -n stacks-network-system set env deployment/network \
            STACKS_API_ACCOUNTING_INTERVAL=5s
          kubectl --kubeconfig "$KCFG" -n stacks-network-system rollout status deployment network --timeout 5m
      - name: Place operator on the server
        if: (inputs.mode == '' || inputs.mode == 'network') && inputs.operator_node != 'agent'
        run: .github/k3s-runners/place-operator.sh "$SERVER_HOST"
      - name: Dashboard
        run: .github/k3s-runners/dashboard.sh "$KCFG" "$CTX"
      - name: Network (${{ env.EXAMPLE }})
        if: inputs.mode == '' || inputs.mode == 'network'
        run: |
          set -o pipefail
          . .github/k3s-runners/example-env.sh
          HOLD_SECONDS=$(( HOLD_MINUTES * 60 )) .github/runner-lib/network.sh \
            "docs/design/public-api/examples/$EXAMPLE.yaml" "$KCFG" "$CTX" out/network | tee out/network.log
      - name: Operator ${{ inputs.mode }} rounds (${{ env.EXAMPLE }})
        if: inputs.mode == 'placement' || inputs.mode == 'images'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          . .github/k3s-runners/example-env.sh
          agent="$NODE_PREFIX-agent-1" image=stacks-network-operator
          if [ "$MODE" = placement ]; then
            title="Operator placement"
            rounds=("agent:$agent:$image:ci" "server:$SERVER_HOST:$image:ci" "agent:$agent:$image:ci")
          else
            [ -n "$BASE_REVERT" ] || { echo "images mode needs base_revert" >&2; exit 1; }
            title="Operator image (base reverts $BASE_REVERT)"
            rounds=("base:$agent:$image:ci-base" "head:$agent:$image:ci" "base:$agent:$image:ci-base")
          fi
          .github/k3s-runners/rounds.sh "docs/design/public-api/examples/$EXAMPLE.yaml" out/rounds "$title" \
            "${rounds[@]}" | tee out/rounds.log
          { cat out/rounds/summary.md; echo; echo '```text'; cat out/images.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p out
          kubectl --kubeconfig "$KCFG" get nodes,pods -A -o wide > out/cluster.txt 2>&1 || true
          kubectl --kubeconfig "$KCFG" get stacksnetworks -A -o yaml > out/network-status.yaml 2>&1 || true
          kubectl --kubeconfig "$KCFG" get events -A --sort-by=.lastTimestamp > out/events.txt 2>&1 || true
          kubectl --kubeconfig "$KCFG" -n stacks-network-system logs deploy/network --tail=-1 > out/operator.log 2>&1 || true
          tailscale status > out/tailscale-status.txt 2>&1 || true
          sudo journalctl -u k3s --no-pager | tail -300 > out/k3s-server.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: server
          path: out

  # Publishes live-access details as soon as the dashboard is up; a job summary appears
  # only when its job ends.
  access:
    name: Access
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          hostname: k3s-${{ github.run_id }}-${{ github.run_attempt }}-access
      - name: Live cluster
        run: |
          set -o pipefail
          .github/k3s-runners/access.sh | tee -a "$GITHUB_STEP_SUMMARY"

  agent:
    name: Agent ${{ matrix.index }}
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.hold == '90' && 175 || inputs.hold == '60' && 145 || inputs.hold == '30' && 115 || 85 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # BASE_REVERT builds need the reverted commit
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          hostname: k3s-${{ github.run_id }}-${{ github.run_attempt }}-agent-${{ matrix.index }}
          args: --ssh
      - run: .github/k3s-runners/install-k3s.sh
      - run: .github/k3s-runners/load-operator-image.sh
      - run: .github/k3s-runners/k3s-node.sh agent
      - name: Hold until the server finishes
        run: .github/k3s-runners/hold-agent.sh $(( 4800 + HOLD_MINUTES * 60 ))
      - name: Agent log
        if: always()
        run: sudo journalctl -u k3s --no-pager | tail -100 || true
