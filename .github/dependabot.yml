version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directories:
      - /apis/network
      - /apis/network/tools
      - /libs/bitcoin
      - /libs/stacks
      - /operators/action
      - /operators/network
      - /operators/observability
      - /operators/observability/tools
      - /tools/chart-policy
      - /tools/local-cluster
      - /tools/module-policy
      - /tools/stacks-evidence
      - /tools/stacks-inspect
      - /tools/stacks-preflight
      - /tools/stacks-workload
    schedule:
      interval: weekly
    groups:
      shared-dependencies:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /operators/network
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /operators/observability
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /operators/action
    schedule:
      interval: weekly
