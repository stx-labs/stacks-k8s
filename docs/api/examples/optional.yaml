# Optional resources require their independently installed operators and enabled capabilities.
---
apiVersion: actions.stacks.org/v1alpha2
kind: BitcoinBlockGeneration
metadata:
  name: three-blocks
  labels:
    actions.stacks.org/correlation-id: ordinary-regtest-check
  namespace: lab-30
spec:
  bitcoinNodeRef:
    name: btc-01
  count: 3
  cadence:
    mode: Fixed
    intervalSeconds: 2
  address: mipcBbFg9gMiCh81Kj8tqqdgoZub1ZJRfn
  timeout: 2m
  networkUID: "${NETWORK_UID}"
---
apiVersion: actions.stacks.org/v1alpha2
kind: BitcoinReorganization
metadata:
  name: replace-two-blocks
  labels:
    actions.stacks.org/correlation-id: local-fork-check
  namespace: lab-30
spec:
  bitcoinNodeRef:
    name: btc-01
  depth: 2
  address: mipcBbFg9gMiCh81Kj8tqqdgoZub1ZJRfn
  boundaryPolicy:
    allowEpochBoundaryCrossing: true
    allowRewardCycleBoundaryCrossing: true
    allowPreparePhaseBoundaryCrossing: true
  timeout: 2m
  networkUID: "${NETWORK_UID}"
---
apiVersion: bitcoin.stacks.org/v1alpha2
kind: BitcoinBlockScheduleOverride
metadata:
  name: slow-blocks
  namespace: lab-30
spec:
  productionRef:
    name: blocks
  schedule:
    cadence:
      mode: Fixed
      interval: 20s
  duration: 2m
  networkUID: "${NETWORK_UID}"
---
apiVersion: observation.stacks.org/v1alpha2
kind: NetworkTelemetry
metadata:
  name: facts
  namespace: lab-30
spec:
  retention:
    window: 6h
  sources:
    objects: true
    logs: true
    metrics: true
  networkName: network
  storageSecretRef: observation-store
  networkUID: "${NETWORK_UID}"
